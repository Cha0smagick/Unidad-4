# Breast Cancer CNN Classification - Configuration
# Invasive Ductal Carcinoma Detection

project:
  name: "Breast Cancer CNN Classifier"
  version: "1.0.0"
  description: "Deep Learning pipeline for Invasive Ductal Carcinoma (IDC) detection from histopathology images"
  author: "Research Team"
  license: "MIT"

data:
  # Dataset paths
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  
  # Dataset parameters
  image_size: [50, 50]  # Standard IDC dataset patch size
  channels: 3  # RGB
  num_classes: 2  # 0: Non-IDC, 1: IDC
  class_names: ["Non-IDC", "IDC"]
  
  # Train/Val/Test split ratios
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  
  # Random seed for reproducibility
  random_seed: 42
  
  # Data augmentation
  augmentation:
    enabled: true
    horizontal_flip: true
    vertical_flip: true
    rotate_limit: 90
    brightness_contrast: true
    gaussian_noise: true
    elastic_transform: true

preprocessing:
  # Normalization (ImageNet stats for transfer learning compatibility)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  
  # DataLoader settings
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:
  # Architecture configuration
  architecture: "CustomCNN"  # Options: CustomCNN, ResNet18, ResNet34, EfficientNet-B0
  
  # Custom CNN parameters
  custom_cnn:
    input_channels: 3
    num_classes: 2
    dropout_rate: 0.5
    use_batch_norm: true
    base_filters: 32
    filter_progression: [32, 64, 128, 256]
    kernel_size: 3
    pool_size: 2
    fc_hidden: [512, 256]
  
  # Transfer learning parameters (if using pretrained)
  transfer_learning:
    freeze_backbone: true
    unfreeze_layers: 0  # Number of layers to unfreeze from the end

training:
  # Training hyperparameters
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-4
  optimizer: "AdamW"  # Options: Adam, AdamW, SGD
  scheduler: "ReduceLROnPlateau"  # Options: ReduceLROnPlateau, CosineAnnealingLR, OneCycleLR
  
  # Scheduler parameters
  scheduler_params:
    ReduceLROnPlateau:
      mode: "min"
      factor: 0.5
      patience: 10
      min_lr: 1e-6
    CosineAnnealingLR:
      T_max: 100
      eta_min: 1e-6
    OneCycleLR:
      max_lr: 0.01
      epochs: 100
      steps_per_epoch: 100
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 1e-4
    monitor: "val_loss"
    mode: "min"
    restore_best_weights: true
  
  # Loss function
  loss_function: "CrossEntropyLoss"
  class_weights: null  # Auto-compute if null
  
  # Mixed precision training
  mixed_precision: true
  
  # Gradient accumulation
  gradient_accumulation_steps: 1
  
  # Checkpointing
  checkpoint_dir: "assets/models/checkpoints"
  save_best_only: true
  save_last: true

evaluation:
  # Metrics to compute
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "confusion_matrix"
    - "classification_report"
  
  # Threshold for binary classification
  threshold: 0.5
  
  # Bootstrap confidence intervals
  bootstrap_ci:
    enabled: true
    n_iterations: 1000
    confidence_level: 0.95

dashboard:
  # Streamlit dashboard configuration
  host: "0.0.0.0"
  port: 8501
  theme:
    primaryColor: "#2E86AB"
    backgroundColor: "#F5F7FA"
    secondaryBackgroundColor: "#FFFFFF"
    textColor: "#2C3E50"
  
  # Visualization settings
  plots:
    dpi: 150
    figsize: [10, 6]
    style: "seaborn-v0_8-whitegrid"

logging:
  # MLflow tracking
  mlflow:
    enabled: true
    tracking_uri: "file:./mlruns"
    experiment_name: "breast-cancer-cnn"
  
  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "logs/tensorboard"
  
  # Console logging
  console:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

reproducibility:
  # Global seeds
  seeds:
    python: 42
    numpy: 42
    torch: 42
    torch_cuda: 42
  
  # Deterministic operations
  deterministic: true
  benchmark: false